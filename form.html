<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 251, 251);
        }
        form {
            width: 350px;
            height: 200px;
            padding: 10px;
            border: 1px solid grey;
            border-radius: 5px;
            background-color: aliceblue;
            box-shadow: 1px 1px 1px 1px rgb(red green blue / alpha);
        }
        .formcontroller {
            padding: 10px;
        }
        input [type="text"] {
            width: 220px;
            height: 35px;
        }
        input [type="password"] {
            width: 22opx;
            height: 35px;
        }
        label {
            font-size: large;
            width: 80px;
            display: inline-block;
        }
        button {
            padding: 10px 135px;
            background-color: black;
            color: antiquewhite;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <form accept="">
        <div class="formcontroller">
            <label for="username">username</label>
            <input
            type="text"
            id="username"
            placeholder="put username"
            name="username"
            />
        </div>
<div class="formcontroller">
     <label for="password">password</label>
     <input type="password" placeholder="put password" id="password"/>
</div>
<div class="formcontroller">
    <button type="submit">LOGIN</button>
</div>
    </form>
</body>
</html>
